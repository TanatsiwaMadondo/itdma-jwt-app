<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudentAuth  JWT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-badge">JWT</span>
    StudentAuth API
  </div>
  <span class="header-tag">HS256 | Bearer Token | Port 8000</span>
</header>

<div class="page">

  <!-- Register -->
  <div class="card">
    <div class="card-title">Register Student</div>
    <div class="endpoint-row">
      <span class="method">POST</span>
      <span class="path">/auth/register</span>
    </div>
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="e.g. Jane Mokoena"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="jane@university.ac.za"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="min. 8 characters"/>
    </div>
    <button class="btn btn-primary" onclick="register()">Create Account</button>
    <div class="response-box" id="reg-result">Response will appear here...</div>
  </div>

  <!-- Login -->
  <div class="card">
    <div class="card-title">Login &amp; Get Token</div>
    <div class="endpoint-row">
      <span class="method">POST</span>
      <span class="path">/auth/login</span>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="jane@university.ac.za"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="your password"/>
    </div>
    <button class="btn btn-primary" onclick="login()">Login</button>
    <div class="token-label" id="token-label" style="display:none">JWT Token (stored in memory)</div>
    <div class="token-display" id="token-display"></div>
    <div class="response-box" id="login-result">Response will appear here...</div>
  </div>

  <!-- Profile -->
  <div class="card bottom-panel">
    <div class="card-title">My Profile</div>
    <div class="endpoint-row">
      <span class="method" style="color:#93C5FD">GET</span>
      <span class="path">/students/me</span>
      <span class="path" style="color:rgba(255,255,255,0.3)">- requires token</span>
    </div>
    <button class="btn btn-outline" onclick="getProfile()">Fetch My Profile</button>
    <div class="profile-grid" id="profile-grid"></div>
    <div class="response-box" id="profile-result">Response will appear here...</div>
  </div>

</div>

<script>
  let jwtToken = null;

  function setResult(id, data, isError = false) {
    const el = document.getElementById(id);
    el.textContent = JSON.stringify(data, null, 2);
    el.className = 'response-box ' + (isError ? 'error' : 'success');
  }

  async function register() {
    const body = {
      full_name: document.getElementById('reg-name').value,
      email:     document.getElementById('reg-email').value,
      password:  document.getElementById('reg-password').value,
    };
    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      setResult('reg-result', data, !res.ok);
    } catch (e) {
      setResult('reg-result', { error: e.message }, true);
    }
  }

  async function login() {
    const body = {
      email:    document.getElementById('login-email').value,
      password: document.getElementById('login-password').value,
    };
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.ok && data.access_token) {
        jwtToken = data.access_token;
        document.getElementById('token-display').style.display = 'block';
        document.getElementById('token-label').style.display = 'block';
        document.getElementById('token-display').textContent = jwtToken;
      }
      setResult('login-result', data, !res.ok);
    } catch (e) {
      setResult('login-result', { error: e.message }, true);
    }
  }

  async function getProfile() {
    if (!jwtToken) {
      setResult('profile-result', { error: 'No token — please login first' }, true);
      return;
    }
    try {
      const res = await fetch('/students/me', {
        headers: { 'Authorization': 'Bearer ' + jwtToken },
      });
      const data = await res.json();
      if (res.ok) {
        const grid = document.getElementById('profile-grid');
        grid.innerHTML = Object.entries(data).map(([k, v]) => `
          <div class="profile-field">
            <div class="profile-key">${k}</div>
            <div class="profile-val">${v ?? '-'}</div>
          </div>`).join('');
      }
      setResult('profile-result', data, !res.ok);
    } catch (e) {
      setResult('profile-result', { error: e.message }, true);
    }
  }
</script>
</body>
</html>
